# Optional: apply only if you have an Ingress controller (nginx, traefik, etc.).
# Replace HOST with your real hostname (e.g. tuna.kirkoc.fr).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  labels:
    app: portfolio
spec:
  ingressClassName: nginx
  rules:
    - host: portfolio.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 80
